  <div class="modal-overlay" id="customerModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('customerModal')">&times;</button>
      <h2>Customer Registration</h2>
      <p>Create a customer account to request personalized care services.</p>

      <form id="customerForm">
        <div class="form-group">
          <label for="cFullName">Full Name</label>
          <input type="text" id="cFullName" placeholder="Enter full name" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cPhone">Phone Number</label>
            <input type="tel" id="cPhone" placeholder="Enter contact number" required />
          </div>
          <div class="form-group">
            <label for="cEmail">Email Address</label>
            <input type="email" id="cEmail" placeholder="e.g. name@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="cCity">City / Locality</label>
          <input type="text" id="cCity" placeholder="Your current location" required />
        </div>

        <div class="form-group">
          <label for="cService">Primary Service Needed</label>
          <input type="text" id="cService" placeholder="e.g. Elder care, Banking support" required />
        </div>

        <div class="form-group services-select" id="cServicesSelect">
          <label class="services-label">Opted Services (select any that apply)</label>
          <div class="service-category">
            <div class="service-category-header">
              Elderly &amp; Recovery Support
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem11" data-code="10001" value="10001 - Non-medical caregiving for seniors" />
                <span>Non-medical caregiving for seniors</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem12" data-code="10002" value="10002 - Recovery assistance following illnesses" />
                <span>Recovery assistance following illnesses</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem13" data-code="10003" value="10003 - Mobility support &amp; timely medication reminders" />
                <span>Mobility support &amp; timely medication reminders</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Travel &amp; Companionship
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem21" data-code="20001" value="20001 - Escort services for doctor visits &amp; hospital appointments" />
                <span>Escort services for doctor visits &amp; hospital appointments</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem22" data-code="20002" value="20002 - Companionship during family travel and outings" />
                <span>Companionship during family travel and outings</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem23" data-code="20003" value="20003 - Safe local transportation assistance" />
                <span>Safe local transportation assistance</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Outside Work &amp; Banking
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem31" data-code="30001" value="30001 - In-person banking &amp; official document support" />
                <span>In-person banking &amp; official document support</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem32" data-code="30002" value="30002 - Bill payments &amp; office paperwork tasks" />
                <span>Bill payments &amp; office paperwork tasks</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem33" data-code="30003" value="30003 - Vegetable market, grocery &amp; pharmacy shopping" />
                <span>Vegetable market, grocery &amp; pharmacy shopping</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              In-Home Assistance
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem41" data-code="40001" value="40001 - Light housekeeping &amp; home organization" />
                <span>Light housekeeping &amp; home organization</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem42" data-code="40002" value="40002 - Meal preparation support" />
                <span>Meal preparation support</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem43" data-code="40003" value="40003 - Managing electrician &amp; plumber visits" />
                <span>Managing electrician &amp; plumber visits</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Content Creation Assistance
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem51" data-code="50001" value="50001 - Social media account setup &amp; management" />
                <span>Social media account setup &amp; management</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem52" data-code="50002" value="50002 - Photo &amp; video editing support" />
                <span>Photo &amp; video editing support</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem53" data-code="50003" value="50003 - Basic content writing (posts, messages, letters)" />
                <span>Basic content writing (posts, messages, letters)</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Construction &amp; Labor Assistance
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem61" data-code="60001" value="60001 - Coordinating with contractors &amp; skilled labor" />
                <span>Coordinating with contractors &amp; skilled labor</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem62" data-code="60002" value="60002 - On-site supervision for repairs &amp; renovations" />
                <span>On-site supervision for repairs &amp; renovations</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="cItem63" data-code="60003" value="60003 - Assistance with material procurement &amp; vendor coordination" />
                <span>Assistance with material procurement &amp; vendor coordination</span>
              </label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="customerSubmitBtn">Register Customer</button>
        <div id="customerResponse" class="form-response-msg"></div>
      </form>
    </div>
  </div>
