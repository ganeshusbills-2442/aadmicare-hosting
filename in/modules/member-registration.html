  <div class="modal-overlay" id="memberModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('memberModal')">&times;</button>
      <h2>Care Member Registration</h2>
      <p>Register as a volunteer or care staff member with AadmiCare.</p>

      <form id="memberForm">
        <div class="form-group">
          <label for="mFullName">Full Name</label>
          <input type="text" id="mFullName" placeholder="Enter full name" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="mAge">Age</label>
            <input type="number" id="mAge" min="18" max="99" placeholder="e.g. 28" required />
          </div>
          <div class="form-group">
            <label for="mGender">Gender</label>
            <select id="mGender" required>
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="mPhone">Phone Number</label>
            <input type="tel" id="mPhone" placeholder="Enter contact number" required />
          </div>
          <div class="form-group">
            <label for="mRole">Registering As</label>
            <select id="mRole" required>
              <option value="Volunteer">Volunteer</option>
              <option value="Care Member">Care Member (Staff)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="mAddress">Address / Location</label>
          <textarea id="mAddress" rows="2" placeholder="Locality, city, area" required></textarea>
        </div>

        <div class="form-group services-select" id="mServicesSelect">
          <label class="services-label">Opted Services (select any that apply)</label>
          <div class="service-category">
            <div class="service-category-header">
              Elder Companion &amp; Healthcare Support
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem11" data-code="10001" value="10001 - Doctor &amp; Hospital Token Assistant" />
                <span>Doctor &amp; Hospital Token Assistant</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem12" data-code="10002" value="10002 - Bedside Recovery &amp; Nursing Help" />
                <span>Bedside Recovery &amp; Nursing Help</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem13" data-code="10003" value="10003 - Daily Check-In &amp; Medication Buddy" />
                <span>Daily Check-In &amp; Medication Buddy</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem14" data-code="10004" value="10004 - Physio &amp; Exercise Partner" />
                <span>Physio &amp; Exercise Partner</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Government, Bank &amp; Property Paperwork
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem21" data-code="20001" value="20001 - Bank &amp; Document Assistant" />
                <span>Bank &amp; Document Assistant</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem22" data-code="20002" value="20002 - Government Office &amp; Municipal Work" />
                <span>Government Office &amp; Municipal Work</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem23" data-code="20003" value="20003 - Property Inspection &amp; Tenant Handover" />
                <span>Property Inspection &amp; Tenant Handover</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Vendor Oversight &amp; Repair Supervision
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem31" data-code="30001" value="30001 - Plumber &amp; Electrician Supervision" />
                <span>Plumber &amp; Electrician Supervision</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem32" data-code="30002" value="30002 - Home Painting &amp; Renovation Supervisor" />
                <span>Home Painting &amp; Renovation Supervisor</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem33" data-code="30003" value="30003 - Interiors &amp; Furniture Assembly Helper" />
                <span>Interiors &amp; Furniture Assembly Helper</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Urgent Errands &amp; Local Delivery Runs
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem41" data-code="40001" value="40001 - Wholesale Market &amp; Festival Shopping" />
                <span>Wholesale Market &amp; Festival Shopping</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem42" data-code="40002" value="40002 - Medicine &amp; Lab Report Collection" />
                <span>Medicine &amp; Lab Report Collection</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem43" data-code="40003" value="40003 - Vehicle Servicing &amp; RTO Runs" />
                <span>Vehicle Servicing &amp; RTO Runs</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Event, Guest &amp; Travel Care
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem51" data-code="50001" value="50001 - Puja &amp; Event Shopping Helper" />
                <span>Puja &amp; Event Shopping Helper</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem52" data-code="50002" value="50002 - Airport &amp; Railway Pickup Assistant" />
                <span>Airport &amp; Railway Pickup Assistant</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem53" data-code="50003" value="50003 - Travel Escort for Seniors" />
                <span>Travel Escort for Seniors</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Digital &amp; Creative Content Help
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem61" data-code="60001" value="60001 - Reels &amp; Product Shoot Assistant" />
                <span>Reels &amp; Product Shoot Assistant</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem62" data-code="60002" value="60002 - Quick Photo &amp; Video Editor" />
                <span>Quick Photo &amp; Video Editor</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem63" data-code="60003" value="60003 - Digital Invite &amp; Google Listing Setup" />
                <span>Digital Invite &amp; Google Listing Setup</span>
              </label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="memberSubmitBtn">Register as Care Member</button>
        <div id="memberResponse" class="form-response-msg"></div>
      </form>
    </div>
  </div>
