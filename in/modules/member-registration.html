  <div class="modal-overlay" id="memberModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('memberModal')">&times;</button>
      <h2>Care Member Registration</h2>
      <p>Register as a volunteer or care staff member with AadmiCare.</p>

      <form id="memberForm">
        <div class="form-group">
          <label for="mFullName">Full Name</label>
          <input type="text" id="mFullName" placeholder="Enter full name" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="mAge">Age</label>
            <input type="number" id="mAge" min="18" max="99" placeholder="e.g. 28" required />
          </div>
          <div class="form-group">
            <label for="mGender">Gender</label>
            <select id="mGender" required>
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="mPhone">Phone Number</label>
            <input type="tel" id="mPhone" placeholder="Enter contact number" required />
          </div>
          <div class="form-group">
            <label for="mRole">Registering As</label>
            <select id="mRole" required>
              <option value="Volunteer">Volunteer</option>
              <option value="Care Member">Care Member (Staff)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="mAddress">Address / Location</label>
          <textarea id="mAddress" rows="2" placeholder="Locality, city, area" required></textarea>
        </div>

        <div class="form-group services-select" id="mServicesSelect">
          <label class="services-label">Opted Services (select any that apply)</label>
          <div class="service-category">
            <div class="service-category-header">
              Elderly &amp; Recovery Support
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem11" data-code="10001" value="10001 - Non-medical caregiving for seniors" />
                <span>Non-medical caregiving for seniors</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem12" data-code="10002" value="10002 - Recovery assistance following illnesses" />
                <span>Recovery assistance following illnesses</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem13" data-code="10003" value="10003 - Mobility support &amp; timely medication reminders" />
                <span>Mobility support &amp; timely medication reminders</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Travel &amp; Companionship
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem21" data-code="20001" value="20001 - Escort services for doctor visits &amp; hospital appointments" />
                <span>Escort services for doctor visits &amp; hospital appointments</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem22" data-code="20002" value="20002 - Companionship during family travel and outings" />
                <span>Companionship during family travel and outings</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem23" data-code="20003" value="20003 - Safe local transportation assistance" />
                <span>Safe local transportation assistance</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              Outside Work &amp; Banking
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem31" data-code="30001" value="30001 - In-person banking &amp; official document support" />
                <span>In-person banking &amp; official document support</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem32" data-code="30002" value="30002 - Bill payments &amp; office paperwork tasks" />
                <span>Bill payments &amp; office paperwork tasks</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem33" data-code="30003" value="30003 - Vegetable market, grocery &amp; pharmacy shopping" />
                <span>Vegetable market, grocery &amp; pharmacy shopping</span>
              </label>
            </div>
          </div>
          <div class="service-category">
            <div class="service-category-header">
              In-Home Assistance
            </div>
            <div class="service-items">
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem41" data-code="40001" value="40001 - Light housekeeping &amp; home organization" />
                <span>Light housekeeping &amp; home organization</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem42" data-code="40002" value="40002 - Meal preparation support" />
                <span>Meal preparation support</span>
              </label>
              <label class="service-item-row">
                <input type="checkbox" class="opted-service" id="mItem43" data-code="40003" value="40003 - Managing electrician &amp; plumber visits" />
                <span>Managing electrician &amp; plumber visits</span>
              </label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="memberSubmitBtn">Register as Care Member</button>
        <div id="memberResponse" class="form-response-msg"></div>
      </form>
    </div>
  </div>
